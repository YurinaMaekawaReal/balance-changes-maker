<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Audiowide&family=Bangers&family=Barlow+Condensed:wght@500;600;700&family=Black+Ops+One&family=Bungee&family=Chakra+Petch:wght@400;500;600;700&family=Exo+2:wght@500;600;700&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&family=Russo+One&family=Teko:wght@500;600;700&display=swap">
<style>
/* Layout: editor rail on the left, live poster stage on the right; stacks on phones. Single dark studio theme by choice. */
:root{
  --bg:#0a0c12; --panel:#11151f; --panel2:#171c29; --line:#242b3c; --line2:#2f374c;
  --fg:#e8ebf4; --dim:#8a93a9; --accent:#8fa2ff; --accent-ink:#0a0c12;
  --buff:#2dffa0; --nerf:#ff3d6e; --warn:#ffc83d;
  --ui:"Chakra Petch", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:400px minmax(0,1fr);gap:12px;height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0;min-width:0}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;gap:10px}

.brand{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.brand svg{flex:none}
.brand h1{margin:0;font-size:19px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.brand small{display:block;color:var(--dim);font-size:11.5px;letter-spacing:.04em;font-weight:500;text-transform:none}
.tabs{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 12px;cursor:pointer;color:var(--dim);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.pane{overflow:auto;padding:14px 14px 40px;flex:1;min-height:0}
.sec{margin-bottom:18px}
.sec>h2{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
.sec>h2::after{content:"";flex:1;height:1px;background:var(--line)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stack{display:flex;flex-direction:column;gap:8px}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:6px 8px;width:100%;min-width:0;font-family:var(--ui);font-size:13px}
textarea{resize:vertical;min-height:54px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=color]{width:100%;height:30px;border:1px solid var(--line2);border-radius:4px;background:var(--bg);padding:2px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.rng{display:grid;grid-template-columns:1fr 42px;gap:6px;align-items:center}
.rng output{font-size:12px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}

.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:12.5px;letter-spacing:.04em;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);text-transform:uppercase;letter-spacing:.1em}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border-style:dashed;width:100%}
.btn.sm{padding:4px 8px;font-size:11.5px}
.btn.danger{color:var(--nerf)}
.ib{background:transparent;border:1px solid transparent;border-radius:3px;width:24px;height:24px;display:inline-grid;place-items:center;cursor:pointer;color:var(--dim);font-size:13px;padding:0;flex:none}
.ib:hover{border-color:var(--line2);color:var(--fg)}
.ib.armed{color:var(--nerf);border-color:var(--nerf);width:auto;padding:0 6px;font-size:11px}

.sess{border:1px solid var(--line);border-radius:5px;background:var(--panel2);margin-bottom:8px}
.sess>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 10px;cursor:pointer;user-select:none}
.sess>summary::-webkit-details-marker{display:none}
.sess>summary .dot{width:10px;height:10px;transform:rotate(45deg);flex:none}
.sess>summary b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vtag{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.grow{flex:1}
.sess[open]>summary{border-bottom:1px solid var(--line)}
.sess-body{padding:10px;display:flex;flex-direction:column;gap:10px}
.group{border:1px solid var(--line);border-radius:4px;padding:8px;background:var(--panel);display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;gap:6px;align-items:center}
.skimg{position:relative;width:64px;height:64px;flex:none;border:1px dashed var(--line2);border-radius:4px;display:grid;place-items:center;text-align:center;font-size:10.5px;line-height:1.25;color:var(--dim);cursor:pointer;background:var(--bg) center/contain no-repeat;font-weight:600;letter-spacing:.04em}
.skimg.has{border-style:solid}
.skimg.drag,.skimg:hover{border-color:var(--accent);color:var(--fg)}
.skimg input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.thumb{width:30px;height:30px;border-radius:3px;background:var(--bg) center/contain no-repeat;border:1px solid var(--line2);flex:none}
.item{border-left:3px solid var(--line2);padding:6px 0 6px 8px;display:flex;flex-direction:column;gap:6px}
.item.stat{border-color:var(--accent)}
.item.note{border-color:var(--warn)}
.ihead{display:flex;gap:6px;align-items:center}
.rows{display:flex;flex-direction:column;gap:3px}
.rowe{display:grid;grid-template-columns:1.1fr 1fr 12px 1fr 24px;gap:4px;align-items:center}
.rowe input{padding:4px 6px;font-size:12px;font-variant-numeric:tabular-nums}
.rowe .arr{color:var(--dim);font-size:11px;text-align:center}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tools input[type=number]{width:52px;padding:4px 6px}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.hint{font-size:12px;color:var(--dim);line-height:1.5;margin:0}

.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.preset{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:8px;border:1px solid var(--line2);border-radius:4px;background:var(--panel2);cursor:pointer;text-align:left}
.preset[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.preset .sw{display:flex;gap:3px}
.preset .sw i{width:16px;height:16px;display:block;transform:skewX(-12deg)}
.preset span{font-size:12px;font-weight:600;letter-spacing:.05em}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 10px;cursor:pointer;font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar select{width:auto;max-width:220px}
.bar .lbl{font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.view{flex:1;min-height:320px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:16px;
  background-color:#07080c;background-image:linear-gradient(45deg,#0d0f15 25%,transparent 25%,transparent 75%,#0d0f15 75%),linear-gradient(45deg,#0d0f15 25%,transparent 25%,transparent 75%,#0d0f15 75%);background-size:22px 22px;background-position:0 0,11px 11px}
.view canvas{display:block;margin:0 auto;box-shadow:0 18px 60px rgba(0,0,0,.6)}
.meta{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:9px 14px;border-radius:5px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:60;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal img{max-width:100%;max-height:75vh;border:1px solid var(--line2)}
.modal p{margin:0;color:var(--fg);text-align:center}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);height:auto}
  .side{order:2;max-height:none}
  .pane{overflow:visible}
  .view{min-height:60vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 2 L27 14 H20 V28 H10 V14 H3 Z" fill="#2dffa0"/><path d="M15 2 L27 14 H20 V28 H15 Z" fill="#139c63"/></svg>
      <h1>Patch Forge<small>Balance change sheets for your characters</small></h1>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-content" aria-selected="true" data-pane="pane-content">Content</button>
      <button class="tab" role="tab" id="tab-style" aria-selected="false" data-pane="pane-style">Style</button>
      <button class="tab" role="tab" id="tab-export" aria-selected="false" data-pane="pane-export">Export</button>
    </div>
    <div class="pane" id="pane-content">
      <div class="sec"><h2>Character</h2><div id="charEd" class="stack"></div></div>
      <div class="sec"><h2>Balance sessions</h2>
        <p class="hint" style="margin-bottom:10px">Tick a session to include it in the multi-session sheet. Use ◎ to render one session on its own.</p>
        <div id="sessions"></div>
        <button class="btn ghost" id="addSession">+ Add balance session</button>
      </div>
    </div>
    <div class="pane" id="pane-style" hidden></div>
    <div class="pane" id="pane-export" hidden></div>
  </aside>

  <main class="stage">
    <div class="bar">
      <div class="seg" role="group" aria-label="Sheet mode">
        <button id="modeMulti" aria-pressed="true">Timeline</button>
        <button id="modeSingle" aria-pressed="false">Single</button>
      </div>
      <select id="singleSel" aria-label="Session to render" hidden></select>
      <span class="lbl">Zoom</span>
      <div class="seg" role="group" aria-label="Zoom">
        <button data-z="fit" aria-pressed="true">Fit</button>
        <button data-z="0.5" aria-pressed="false">50%</button>
        <button data-z="1" aria-pressed="false">100%</button>
      </div>
      <span class="grow"></span>
      <span class="meta" id="meta"></span>
      <button class="btn primary" id="exportBtn">Export PNG</button>
    </div>
    <div class="bar"><span class="lbl">Preset</span><div class="chips" id="presetChips"></div></div>
    <div class="view" id="view"><canvas id="cv"></canvas></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden></div>

<script>
/* ================= utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'type' || k === 'hidden' || k === 'min' || k === 'max' || k === 'step') e[k] = v;
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
function hexToRgb(h) { h = String(h || '#000').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h.slice(0, 6), 16) || 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbToHex(r, g, b) { return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); }
function rgba(h, a) { const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; }
const slug = s => String(s || 'sheet').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'sheet';
function num(v) { const m = String(v ?? '').replace(',', '.').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

/* ================= presets ================= */
const DISPLAY_FONTS = [['Bungee', '400'], ['Russo One', '400'], ['Orbitron', '900'], ['Bangers', '400'], ['Teko', '700'], ['Black Ops One', '400'], ['Anton', '400'], ['Audiowide', '400']];
const BODY_FONTS = ['Chakra Petch', 'Rajdhani', 'Barlow Condensed', 'Exo 2'];
const PRESETS = {
  neon: { label: 'Neon Arena', bg1: '#070910', bg2: '#121633', bgStyle: 'grid', colors: { buff: '#2dffa0', nerf: '#ff3d6e', rework: '#ffc83d', adjust: '#a3abbd' }, text: '#f2f5ff', dim: '#8790ad', accent: '#7d8bff', font: 'Bungee', body: 'Chakra Petch', face: 'gradient', depth: 6, angle: 70, outline: '#05060b', outlineW: 3, glow: 16, panel: 'glass', corner: 'cut', cardBg: '#0b0e1a', cardAlpha: 0.74, cardText: '#eef1ff', cardDim: '#8d96b5', patternOpacity: 0.1, patternSize: 34, patternTilt: -18 },
  classic: { label: 'Classic Panels', bg1: '#08080a', bg2: '#141418', bgStyle: 'plain', colors: { buff: '#43c53a', nerf: '#e0303f', rework: '#e2a72a', adjust: '#8e8e96' }, text: '#ffffff', dim: '#d6d6d6', accent: '#33d0ff', font: 'Russo One', body: 'Rajdhani', face: 'gradient', depth: 5, angle: 80, outline: '#150a05', outlineW: 3, glow: 0, panel: 'fill', corner: 'sharp', cardBg: '#000000', cardAlpha: 0.4, cardText: '#ffffff', cardDim: '#e2e2e2', patternOpacity: 0.26, patternSize: 40, patternTilt: -35 },
  chrome: { label: 'Holo Chrome', bg1: '#161922', bg2: '#2d3343', bgStyle: 'radial', colors: { buff: '#5ef2c6', nerf: '#ff6b8b', rework: '#ffd66b', adjust: '#b8c0d0' }, text: '#ffffff', dim: '#a7afc4', accent: '#c9d4ff', font: 'Orbitron', body: 'Exo 2', face: 'chrome', depth: 7, angle: 60, outline: '#0d0f15', outlineW: 2.5, glow: 8, panel: 'metal', corner: 'round', cardBg: '#10131b', cardAlpha: 0.72, cardText: '#f1f4ff', cardDim: '#9aa3ba', patternOpacity: 0.07, patternSize: 30, patternTilt: 0 },
  comic: { label: 'Comic Burst', bg1: '#2147e0', bg2: '#0c1c78', bgStyle: 'halftone', colors: { buff: '#3ee05a', nerf: '#ff3344', rework: '#ffcc00', adjust: '#a9aeb9' }, text: '#ffffff', dim: '#e3e9ff', accent: '#ffcc00', font: 'Bangers', body: 'Barlow Condensed', face: 'gradient', depth: 8, angle: 45, outline: '#000000', outlineW: 4, glow: 0, panel: 'comic', corner: 'sharp', cardBg: '#ffffff', cardAlpha: 1, cardText: '#111111', cardDim: '#45464d', patternOpacity: 0.2, patternSize: 36, patternTilt: -25 },
  esports: { label: 'Esports Minimal', bg1: '#0e1116', bg2: '#12161d', bgStyle: 'scan', colors: { buff: '#4ade80', nerf: '#f43f5e', rework: '#f59e0b', adjust: '#9ca3af' }, text: '#eef1f6', dim: '#7c8596', accent: '#e8ecf3', font: 'Teko', body: 'Barlow Condensed', face: 'flat', depth: 2, angle: 90, outline: '#000000', outlineW: 0, glow: 0, panel: 'line', corner: 'sharp', cardBg: '#161a21', cardAlpha: 1, cardText: '#eef1f6', cardDim: '#7c8596', patternOpacity: 0.035, patternSize: 28, patternTilt: 0 },
  tactical: { label: 'Tactical Ops', bg1: '#191c15', bg2: '#2a2f22', bgStyle: 'scan', colors: { buff: '#9bd23c', nerf: '#ff5a36', rework: '#f2c14e', adjust: '#a8a796' }, text: '#f1ecd9', dim: '#a7a58f', accent: '#f2c14e', font: 'Black Ops One', body: 'Rajdhani', face: 'gradient', depth: 5, angle: 65, outline: '#0e100b', outlineW: 2.5, glow: 0, panel: 'fill', corner: 'cut', cardBg: '#0e100b', cardAlpha: 0.55, cardText: '#f1ecd9', cardDim: '#bdb9a0', patternOpacity: 0.14, patternSize: 30, patternTilt: -45 },
  royal: { label: 'Royal Gold', bg1: '#140b24', bg2: '#2c1655', bgStyle: 'radial', colors: { buff: '#47e6a0', nerf: '#ff4f7b', rework: '#ffcf4a', adjust: '#b3aac8' }, text: '#fff6e0', dim: '#bba9d9', accent: '#ffcf4a', font: 'Anton', body: 'Exo 2', face: 'chrome', depth: 6, angle: 75, outline: '#120822', outlineW: 3, glow: 10, panel: 'glass', corner: 'round', cardBg: '#120a22', cardAlpha: 0.72, cardText: '#fff6e0', cardDim: '#b9a8d6', patternOpacity: 0.08, patternSize: 36, patternTilt: -20 }
};
const fontWeight = f => (DISPLAY_FONTS.find(d => d[0] === f) || [f, '400'])[1];
const VERDICTS = [['buff', 'Buff'], ['nerf', 'Nerf'], ['rework', 'Rework'], ['adjust', 'Adjustment']];

/* ================= sample project ================= */
const lv = pairs => pairs.map((p, i) => ({ label: 'Level ' + (i + 1), before: String(p[0]), after: String(p[1]) }));
const stat = (stat, rows, polarity = 'higher', mode = 'auto') => ({ id: uid(), type: 'stat', stat, polarity, mode, rows });
const note = (text, mode = 'auto') => ({ id: uid(), type: 'note', text, mode });
const grp = (name, items) => ({ id: uid(), name, icon: '', items });
const sess = (date, verdict, groups, cols = 1) => ({ id: uid(), date, subtitle: 'Balance Update', verdict, include: true, cols: String(cols), stamp: '', groups });
function sampleProject() {
  return {
    v: 1,
    character: { name: 'Tsuyu Asui', subtitle: 'Default costume', tag: 'Rapid', accent: '#3fd18a', image: '', focusY: 0.3, zoom: 1 },
    style: Object.assign({ key: 'neon' }, clone(PRESETS.neon)),
    layout: { mode: 'multi', single: 0, colWidth: 232, perRow: 9, minHeight: 640, showChar: true, charWidth: 260, showBanner: true, bannerTitle: 'Balance History', bannerSub: '', showSummary: true, showUpcoming: true, upcomingLabel: 'Upcoming', stampSize: 46, stampTilt: -6, stampPos: 'bottom', iconSize: 64, autoBadge: true, strike: true, levelPrefix: 'Level', footer: '', scale: '2', iconStyle: 'top', singleColWidth: 440, singleStamp: 92, bigAuto: true, bigMaxRows: 3, heroScale: 1, heroDepth: 1.2, heroTilt: -4, heroSkew: -8, heroTurn: 0, heroArrow: 'chunky', heroBefore: 'dim', heroDirIcon: true, labels: { buff: 'BUFF', nerf: 'NERF', rework: 'REWORK', adjust: 'ADJUST' } },
    sessions: [
      sess('Oct 12, 2023', 'nerf', [grp('Stealth Skill', [stat('Duration', lv([['12s', '5s'], ['13s', '8.5s'], ['14.2s', '12s']]))])]),
      sess('Nov 8, 2023', 'nerf', [
        grp('Tongue Grapple', [stat('Ammo', lv([[3, 2], [3, 2], [3, 2]])), stat('Normal DMG', lv([[65, 56], [70, 60], [75, 64], [80, 68], [82, 70], [84, 72], [86, 74], [88, 75], [90, 77]]))]),

function renderStylePane() {
  const pane = $('#pane-style'); pane.textContent = '';

    el('div', { class: 'sw' }, ...[p.bg2, p.colors.buff, p.colors.nerf, p.colors.rework, p.accent].map(c => el('i', { style: `background:${c}` }))), el('span', {}, p.label))));
  pane.append(el('div', { class: 'sec' }, el('h2', {}, 'Presets'), pg, el('p', { class: 'hint', style: 'margin-top:8px' }, 'A preset sets every option below. Tweak anything after picking one.')));
  STYLE_SPEC.forEach(([title, items]) => {
    const g = el('div', { class: 'grid2' });

      const id = 'st-' + path.replace(/\./g, '-'); let ctl;
      if (type === 'color') { ctl = el('input', { type: 'color', id }); ctl.value = getPath(path); ctl.addEventListener('input', () => { setPath(path, ctl.value); proj.style.key = 'custom'; changed(); renderSessionDots(); }); }
      else if (type === 'select') { ctl = el('select', { id }); a.forEach(([v, l]) => ctl.append(el('option', { value: v }, l))); ctl.value = getPath(path); ctl.addEventListener('change', () => { setPath(path, ctl.value); proj.style.key = 'custom'; ensureFonts(); changed(); }); }
      else if (type === 'range') ctl = range(path, a, b, c, id);
      else if (type === 'text') { ctl = el('input', { type: 'text', id, placeholder: a || '' }); ctl.value = getPath(path) ?? ''; ctl.addEventListener('input', () => { setPath(path, ctl.value); changed(); }); }
      else if (type === 'check') { const cb = el('input', { type: 'checkbox', id }); cb.checked = !!getPath(path); cb.addEventListener('change', () => { setPath(path, cb.checked); changed(); }); g.append(el('label', { class: 'chk', style: 'grid-column:span 2' }, cb, label)); return; }
      g.append(field(label, ctl));

}
function renderSessionDots() { renderSessionsEd(); }
function applyPreset(k) {

}
function renderPresetChips() {

/* export pane */
function renderExportPane() {
  const pane = $('#pane-export'); pane.textContent = '';
  const sc = el('select', { id: 'ex-scale' }); [['1', '1× (standard)'], ['2', '2× (sharp)'], ['3', '3× (print)'], ['4', '4× (huge)']].forEach(([v, l]) => sc.append(el('option', { value: v }, l))); sc.value = String(proj.layout.scale);
  sc.addEventListener('change', () => { proj.layout.scale = sc.value; changed(); });
  const load = el('input', { type: 'file', accept: '.json,application/json', 'aria-label': 'Load project file' });
  load.addEventListener('change', () => {
    const f = load.files[0]; if (!f) return; const fr = new FileReader();
    fr.onload = () => { try { const p = JSON.parse(fr.result); if (!p || !Array.isArray(p.sessions)) throw 0; normalize(p); proj = p; renderAll(); changed(); toast('Project loaded'); } catch (e) { toast('That file is not a Patch Forge project.'); } };
    fr.readAsText(f); load.value = '';
  });
  let resetArmed = null;
  const resetBtn = (label, fn) => { const b = el('button', { class: 'btn', type: 'button' }, label); b.addEventListener('click', () => { if (resetArmed === b) { fn(); resetArmed = null; return; } resetArmed = b; b.textContent = 'Click again to replace current work'; setTimeout(() => { b.textContent = label; if (resetArmed === b) resetArmed = null; }, 3000); }); return b; };
  pane.append(
    el('div', { class: 'sec' }, el('h2', {}, 'Image'),
      el('div', { class: 'stack' }, field('Resolution', sc),
        el('button', { class: 'btn primary', type: 'button', onclick: exportPNG }, 'Export PNG'),
        el('p', { class: 'hint' }, 'Timeline mode exports every ticked session. Single mode exports just the chosen one. Use 2× or more for social posts.'))),
    el('div', { class: 'sec' }, el('h2', {}, 'Project file'),
      el('div', { class: 'stack' },
        el('button', { class: 'btn', type: 'button', onclick: async () => { const b = new Blob([JSON.stringify(proj, null, 1)], { type: 'application/json' }); await saveFile(slug(proj.character.name) + '-patch-forge.json', b); } }, 'Save project (.json)'),
        el('span', { class: 'btn file' }, 'Load project (.json)', load),
        el('p', { class: 'hint' }, 'Your work also autosaves in this browser. Save a project file per character to keep a library.'))),
    el('div', { class: 'sec' }, el('h2', {}, 'Start over'),
      el('div', { class: 'grid2' },
        resetBtn('Load example', () => { proj = sampleProject(); renderAll(); changed(); }),
        resetBtn('Blank character', () => { proj = blankProject(); renderAll(); changed(); })))
  );
}

/* top bar */
function refreshSingle() {
  const sel = $('#singleSel'); sel.textContent = '';
  proj.sessions.forEach((s, i) => sel.append(el('option', { value: String(i) }, `${s.date || 'Untitled'} · ${s.verdict}`)));
  sel.value = String(Math.min(proj.layout.single, Math.max(0, proj.sessions.length - 1)));
}
function syncMode() {
  const single = proj.layout.mode === 'single';
  $('#modeMulti').setAttribute('aria-pressed', String(!single)); $('#modeSingle').setAttribute('aria-pressed', String(single));
  $('#singleSel').hidden = !single; refreshSingle();
}
$('#modeMulti').onclick = () => { proj.layout.mode = 'multi'; syncMode(); changed(); };
$('#modeSingle').onclick = () => { proj.layout.mode = 'single'; syncMode(); changed(); };
$('#singleSel').onchange = e => { proj.layout.single = +e.target.value; changed(); };

$('#exportBtn').onclick = exportPNG;
$('#addSession').onclick = () => { const s = sess('New patch', 'buff', [grp('Ability', [stat('Damage', [{ label: proj.layout.levelPrefix + ' 1', before: '100', after: '110' }])])]); proj.sessions.push(s); openSet.add(s.id); rebuild(); };
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => { x.setAttribute('aria-selected', String(x === t)); $('#' + x.dataset.pane).hidden = x !== t; });
});
function renderAll() { renderChar(); renderSessionsEd(); renderStylePane(); renderExportPane(); renderPresetChips(); syncMode(); }
window.addEventListener('resize', () => { if (zoom === 'fit') redraw(); });

</script>
